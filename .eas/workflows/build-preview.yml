  #   after: [build_preview]
  #   type: github-comment
  #   environment: preview
  #   params:
  #     message: |
  #       ## Preview Build Ready

  #       **APK:** https://expo.dev/artifacts/${{ needs.build_preview.outputs.build_id }}

  #       | Platform | Version | Build ID |
  #       |----------|---------|----------|
  #       | Android  | ${{ needs.build_preview.outputs.app_version }} | `${{ needs.build_preview.outputs.build_id }}` |

  #       Download the APK from the **Checks** tab above.
