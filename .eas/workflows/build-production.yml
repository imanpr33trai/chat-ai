# Builds both Android (APK) and iOS in parallel on push to main.
# After both succeed: submits to stores, posts results to PR.
name: Production Build Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "!**/*.md"
      - "!.gitignore"
      - "!*.lock"
      - "!docs/**"

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: latest

jobs:
  # ─── Build Android APK ────────────────────────────────────────────────────
  build_android:
    name: Build Android (APK)
    type: build
    environment: production
    params:
      platform: android
      profile: production
      message: "Build from ${{ github.ref_name }} @ ${{ github.sha }}"

  # ─── Build iOS ─────────────────────────────────────────────────────────────
