# CI build on push to main — validates the APK compiles without releasing.
# Actual releases are triggered by release/* branches via create-production-builds.yml.
name: Build Production

on:
  push:
    branches:
      - Sing
    paths:
      - "!**/*.md"
      - "!.gitignore"
      - "!*.lock"
      - "!docs/**"

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: latest

jobs:
  build_android:
    name: Build Android (APK)
    type: build
    environment: production
    params:
      platform: android
      profile: production
      message: "Build from ${{ github.ref_name }} @ ${{ github.sha }}"
