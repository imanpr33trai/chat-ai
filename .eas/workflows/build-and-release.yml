name: Build  and Release EAS

on:
  push:
    branches:
      - main

# 👇 ADD PERMISSIONS FOR RELEASE CREATION
permissions:
  contents: write

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    bun: latest

jobs:
  # ─── Build Android APK ────────────────────────────────────────────────────
  build_android:
    name: Build Android (APK)
    type: build
    environment: production
    params:
      platform: android
      profile: production
      message: "Release build for ${{ github.ref_name }} @ ${{ github.sha }}"

  # ─── Download APK ─────────────────────────────────────────────────────────
  download_apk:
    name: Download APK Artifact
    needs: [build_android]
    runs_on: linux-large
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/download_build
        id: apk
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-${{ github.ref_name }}-apk
          path: ${{ steps.apk.outputs.artifact_path }}
          retention-days: 30

      # ─── NEW: Create GitHub Release & attach APK ───────────────────────────
      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          APK_PATH="${{ steps.apk.outputs.artifact_path }}"

          # Use a clean release title and body
          RELEASE_TITLE="Release ${TAG}"
          RELEASE_NOTES="Automated production build for tag ${TAG}"

          gh release create "$TAG" \
            "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES"
