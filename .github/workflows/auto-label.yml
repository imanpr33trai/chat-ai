name: Auto-Label PRs

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR
        uses: actions/github-script@v7
        with:
          script: |
            const labels = new Set();
            const { title, body } = context.payload.pull_request;
            const files = context.payload.changed_files ?? 0;

            const t = title.toLowerCase();
            if (t.startsWith('fix') || t.startsWith('hotfix')) labels.add('type:bug');
            else if (t.startsWith('feat') || t.startsWith('add') || t.startsWith('implement')) labels.add('type:feature');
            else if (t.startsWith('refactor') || t.startsWith('cleanup')) labels.add('type:refactor');
            else if (t.startsWith('docs') || t.includes('documentation')) labels.add('type:docs');
            else if (t.startsWith('ci') || t.startsWith('workflow')) labels.add('type:ci');
            else if (t.startsWith('chore')) labels.add('type:chore');

            if (files > 20) labels.add('size:large');
            else if (files > 5) labels.add('size:medium');
            else labels.add('size:small');

            if (body?.includes('breaking')) labels.add('breaking');

            const currentLabels = context.payload.pull_request.labels.map(l => l.name);
            for (const lbl of currentLabels) {
              if (lbl.startsWith('type:') || lbl.startsWith('size:') || lbl === 'breaking') {
                try { await github.rest.issues.removeLabel({ issue_number: context.issue.number, name: lbl }); } catch (_) {}
              }
            }
            for (const lbl of labels) {
              try { await github.rest.issues.addLabels({ issue_number: context.issue.number, labels: [lbl] }); } catch (_) {}
            }