name: Build, Release & Version

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}

jobs:
  # ─── Build Check ────────────────────────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Prebuild (generate android/ios dirs)
        run: bun run expo prebuild --clean
        env:
          EXPO_NO_TELEMETRY: 1

  # ─── EAS Build (Preview) ────────────────────────────────────────────────────
  eas-preview:
    name: EAS Build Preview
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: EAS Build (Preview)
        run: bun run eas build --platform all --profile preview --non-interactive
        env:
          EAS_BUILD_CONTEXT: ${{ toJSON(github) }}

  # ─── EAS Build (Production) ────────────────────────────────────────────────
  eas-production:
    name: EAS Build Production
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: EAS Build (Production)
        run: bun run eas build --platform all --profile production --non-interactive
        env:
          EAS_BUILD_CONTEXT: ${{ toJSON(github) }}

  # ─── Versioning & Release Branch ───────────────────────────────────────────
  version-and-release:
    name: Version & Release Branch
    runs-on: ubuntu-latest
    needs: eas-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      release_branch: ${{ steps.version.outputs.release_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read current version
        id: current
        run: |
          CURRENT=$(node -e "console.log(require('./app.json').expo.version)")
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Determine version bump type
        id: bump
        run: |
          # Check for major keywords in commits
          MAJOR=$(git log --oneline -20 | grep -Ei "breaking|major|BREAK" | wc -l)
          if [ "$MAJOR" -gt 0 ]; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            MINOR=$(git log --oneline -10 | grep -Ei "feat|feature|Feature|FEAT" | wc -l)
            if [ "$MINOR" -gt 0 ]; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Calculate new version
        id: version
        run: |
          CURRENT=${{ steps.current.outputs.current_version }}
          BUMP=${{ steps.bump.outputs.type }}

          bunx semver $CURRENT --increment $BUMP | tail -1 > new_version.txt
          NEW_VERSION=$(cat new_version.txt)
          RELEASE_BRANCH="release/v${NEW_VERSION}"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Create release branch and update versions
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          RELEASE_BRANCH=${{ steps.version.outputs.release_branch }}

          # Update app.json
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$NEW_VERSION';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

          # Update package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Create release branch
          git checkout -b $RELEASE_BRANCH
          git add app.json package.json
          git commit -m "chore: bump version to $NEW_VERSION

          bumped from ${{ steps.current.outputs.current_version }} via CI"

          git push origin $RELEASE_BRANCH
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          release_name: Release v${{ steps.version.outputs.new_version }}
          body: |
            ## What's New

            Version ${{ steps.version.outputs.new_version }} built and released via CI/CD.

            Built from: `${{ github.sha }}`
          draft: false
          prerelease: false
          branch: ${{ steps.version.outputs.release_branch }}