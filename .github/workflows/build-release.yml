name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  # ─── Stage 1: CI checks ─────────────────────────────────────────
  ci:
    name: Lint & Typecheck
    uses: ./.github/workflows/_ci.yml
    with:
      ref: ${{ github.sha }}

  # ─── Stage 2: Build (only if CI passed) ──────────────────────────
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        fetch-depth: 25

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate release notes
        run: |
          mkdir -p target/
          bash ./script/generate-release-notes.sh "${{ env.TAG }}" "stable" > target/release-notes.md

      - name: Trigger EAS build
        id: trigger
        run: |
          BUILD_ID=$(npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --json \
            --message "Release ${{ env.TAG }}" \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build
        run: bash ./script/wait-for-build.sh "${{ steps.trigger.outputs.build_id }}"

      - name: Get artifact URL
        id: artifact
        run: |
          APK_URL=$(npx eas-cli build:view ${{ steps.trigger.outputs.build_id }} --json \
            | jq -r '.artifacts.applicationArchiveUrl')
          echo "url=$APK_URL" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.TAG }}
          path: ${{ steps.trigger.outputs.build_id }}/app.apk
          retention-days: 30
          if-no-files-found: error

  # ─── Stage 3: Publish release ────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk-${{ env.TAG }}
          path: ./artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find ./artifacts/ -name "*.apk" | head -1)
          gh release create "${{ env.TAG }}" \
            "$APK_PATH" \
            --title "Release ${{ env.TAG }}" \
            --notes "target/release-notes.md"

  # ─── Stage 4: Notify (runs after publish, regardless of outcome) ─
  notify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify on success
        if: success()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "✅ Release \`${{ env.TAG }}\` published successfully" \
            "success"

      - name: Notify on failure
        if: failure()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "❌ Release \`${{ env.TAG }}\` FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "failure"