name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate release notes
        run: |
          mkdir -p target/
          bash ./script/generate-release-notes.sh "${{ env.TAG }}" "stable" > target/release-notes.md

      - name: Start EAS Build
        id: build
        run: |
          BUILD_ID=$(npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --json \
            --message "Release $TAG_MSG" \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build (with 45min timeout)
        run: |
          MAX_WAIT=2700
          ELAPSED=0
          sleep 30
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(npx eas-cli build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status')
            if [ "$STATUS" = "FINISHED" ]; then
              echo "Build completed successfully"
              break
            elif [ "$STATUS" = "ERRORED" ]; then
              echo "Build failed"
              exit 1
            fi
            echo "Build status: $STATUS. Waiting... (${ELAPSED}s)"
            sleep 60
            ELAPSED=$((ELAPSED + 60))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Build timed out after 45 minutes"
            exit 1
          fi

      - name: Download APK
        id: download
        run: |
          APK_URL=$(npx eas-cli build:view ${{ steps.build.outputs.build_id }} --json \
            | jq -r '.artifacts.applicationArchiveUrl')
          APK_FILENAME="app-release-${{ github.ref_name }}.apk"
          curl -fL -o "$APK_FILENAME" "$APK_URL"
          echo "apk_path=$APK_FILENAME" >> $GITHUB_OUTPUT

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: ${{ steps.download.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG }}" \
            "${{ steps.download.outputs.apk_path }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated production build. Commit: \`${{ github.sha }}\`"
