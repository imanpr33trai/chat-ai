name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: npx eas-cli build --platform android --profile production --non-interactive

      - name: Download
        run: |
          sleep 30
          npx eas-cli build:list --limit 1 --status finished --json | \
            jq -r '.[0].artifacts.applicationArchiveUrl' | \
            xargs -I {} curl -fL -o app-release.apk {}

      - uses: softprops/action-gh-release@v1
        with:
          files: app-release.apk