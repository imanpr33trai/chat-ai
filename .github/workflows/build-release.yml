name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  EXPO_PUBLIC_API_URL: https://api-gateway-dun-two.vercel.app

jobs:
  # ─── Stage 1: CI checks ─────────────────────────────────────────
  ci:
    name: Lint & Typecheck
    uses: ./.github/workflows/_ci.yml
    with:
      ref: ${{ github.sha }}

  # ─── Stage 2: Build (only if CI passed) ──────────────────────────
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          MYAPP_RELEASE_STORE_FILE: my-release-key.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_RELEASE_STORE_FILE=$MYAPP_RELEASE_STORE_FILE \
            -PMYAPP_RELEASE_STORE_PASSWORD=$MYAPP_RELEASE_STORE_PASSWORD \
            -PMYAPP_RELEASE_KEY_ALIAS=$MYAPP_RELEASE_KEY_ALIAS \
            -PMYAPP_RELEASE_KEY_PASSWORD=$MYAPP_RELEASE_KEY_PASSWORD \
            --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.TAG }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

  # ─── Stage 3: Publish release ────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk-${{ env.TAG }}
          path: ./artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find ./artifacts/ -name "*.apk" | head -1)
          gh release create "${{ env.TAG }}" \
            "$APK_PATH" \
            --title "Release ${{ env.TAG }}" \
            --notes "Release ${{ env.TAG }} — built from \`${{ github.sha }}\`"

  # ─── Stage 4: Notify ─────────────────────────────────────────────
  notify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify on success
        if: success()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "✅ Release \`${{ env.TAG }}\` published successfully" \
            "success"

      - name: Notify on failure
        if: failure()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "❌ Release \`${{ env.TAG }}\` FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "failure"