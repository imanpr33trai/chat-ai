name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Run CI checks first — nothing builds unless CI passes
  ci:
    name: CI
    uses: ./.github/workflows/ci-lint-typecheck.yml
    with:
      ref: ${{ github.sha }}

  # Build only after CI succeeds
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        fetch-depth: 25

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate release notes
        run: |
          mkdir -p target/
          bash ./script/generate-release-notes.sh "${{ env.TAG }}" "stable" > target/release-notes.md

      - name: Start EAS Build
        id: build
        run: |
          TAG_MSG="${{ env.TAG }}"
          BUILD_ID=$(npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --json \
            --message "Release $TAG_MSG" \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build
        run: bash ./script/wait-for-build.sh "${{ steps.build.outputs.build_id }}"

      - name: Download APK
        id: download
        run: |
          mkdir -p target/
          APK_URL=$(npx eas-cli build:view ${{ steps.build.outputs.build_id }} --json \
            | jq -r '.artifacts.applicationArchiveUrl')
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.TAG }}
          path: ${{ steps.build.outputs.build_id }}/app.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG }}" \
            "${{ steps.download.outputs.apk_path }}" \
            --title "Release ${{ env.TAG }}" \
            --notes "target/release-notes.md"

      - name: Notify on success
        if: success()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "✅ Release \`${{ env.TAG }}\` published successfully" \
            "success"

      - name: Notify on failure
        if: failure()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "❌ Release \`${{ env.TAG }}\` FAILED — check ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "failure"