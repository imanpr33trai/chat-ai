name: Close Stale PRs

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale PRs
        uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-pr-label: "stale"
          close-pr-message: |
            This PR was closed because it has been inactive for 30 days.
            If this is still needed, feel free to reopen or create a new PR.
          stale-pr-message: |
            This PR has been idle for 30 days. It will be closed in 7 days if no activity.