name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (android, ios, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eas-build:
    name: EAS Build (${{ inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Login to Expo
        uses: expo/expo-github-action@v8
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Install EAS CLI
        run: bun add -g eas-cli

      - name: EAS Build
        run: |
          eas build --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --json
        env:
          EAS_BUILD_CONTEXT: ${{ toJSON(github) }}
          EXPO_NO_TELEMETRY: 1

      - name: Parse build result
        id: result
        run: |
          BUILD_ID=$(bunx expo-env-info --json 2>/dev/null | grep -o '"buildId":"[^"]*"' | cut -d'"' -f4 || echo "")
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build triggered for ${{ inputs.platform }} on ${{ inputs.profile }} profile"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'EAS build triggered for `${{ inputs.platform }}` with `${{ inputs.profile }}` profile.\n\nTrack: https://expo.dev/builds'
            })