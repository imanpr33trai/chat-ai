name: Release APK
on:
  push:
    tags: ["v*"] # Triggers when you push a tag like v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Set this in GitHub Repo Secrets

      - name: Install dependencies
        run: npm install

      - name: Build APK on EAS
        # --non-interactive is key for CI; --wait ensures the script waits for completion
        run: npx eas-build -p android --profile preview --non-interactive --wait --output=app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
