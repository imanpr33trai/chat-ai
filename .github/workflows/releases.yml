name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ workflow.ref }}

permissions:
  contents: write

jobs:
  # ─── Build APK via EAS ─────────────────────────────────────────────────────
  build-apk:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.eas_build.outputs.build_id }}
      build_url: ${{ steps.eas_build.outputs.build_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger EAS build
        id: eas_build
        run: |
          BUILD_JSON=$(npx eas build --platform android \
            --profile production \
            --non-interactive \
            --json \
            --message "Release build for ${{ github.ref_name }}")

          BUILD_ID=$(echo "$BUILD_JSON" | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              const lines = chunks.join('').trim().split('\n');
              // Find the last line that looks like a build result
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const obj = JSON.parse(lines[i]);
                  if (obj.id) { console.log(obj.id); return; }
                } catch (_) {}
              }
            });
          ")

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "build_url=https://expo.dev/artifacts/$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for EAS build to complete
        run: |
          BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          echo "Waiting for build $BUILD_ID to complete..."

          while true; do
            STATUS=$(npx eas build:view "$BUILD_ID" --json 2>/dev/null | \
              node -e "
                const chunks = [];
                process.stdin.on('data', c => chunks.push(c));
                process.stdin.on('end', () => {
                  try {
                    const data = JSON.parse(chunks.join(''));
                    console.log(data.status || 'UNKNOWN');
                  } catch (_) { console.log('PENDING'); }
                });
              " 2>/dev/null || echo "PENDING")

            echo "Build status: $STATUS"

            case "$STATUS" in
              "finished")   echo "Build finished successfully"; break ;;
              "failed")     echo "Build failed"; exit 1 ;;
              "pending"|"in-progress"|"queued") echo "Still building..."; sleep 60 ;;
              *)            echo "Unknown status: $STATUS"; sleep 30 ;;
            esac
          done

  # ─── Download APK ─────────────────────────────────────────────────────────
  download-apk:
    name: Download APK
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Download build artifact
        run: |
          npx eas build:download --id ${{ needs.build-apk.outputs.build_id }} \
            --platform android \
            --output ./dist \
            --profile production

      - name: Find APK file
        id: find_apk
        run: |
          APK=$(find ./dist -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found in dist/"
            ls -la ./dist/
            exit 1
          fi
          echo "APK found: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-${{ github.ref_name }}-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  create-release:
    name: Create Release
    needs: [build-apk, download-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: chat-app-${{ github.ref_name }}-apk
          path: ./dist

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"   # v1.2.3
          VERSION="${TAG#v}"                # 1.2.3
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          CHANGELOG=$(git log ${PREV_TAG:-$TAG}..$TAG --oneline --format="- %s (%h)")
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## chat-app v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Build:** ${{ needs.build-apk.outputs.build_url }}" >> $GITHUB_OUTPUT
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Changes" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo EOF >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ fromJson(steps.changelog.outputs.body) }}
          files: dist/*.apk
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
