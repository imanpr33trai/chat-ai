name: Build Preview APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Run CI checks first — build only starts if CI passes
  ci:
    name: CI
    uses: ./.github/workflows/ci-lint-typecheck.yml
    with:
      ref: ${{ github.sha }}

  # Build only after CI succeeds
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start EAS Build
        id: build
        run: |
          COMMIT_MSG="${{ github.event.head_commit?.message || github.event.pull_request?.title || 'Preview build' }}"
          BUILD_ID=$(npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --message "${COMMIT_MSG:0:100}" \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build
        run: bash ./script/wait-for-build.sh "${{ steps.build.outputs.build_id }}"

      - name: Download APK
        id: download
        run: |
          APK_URL=$(npx eas-cli build:view ${{ steps.build.outputs.build_id }} --json \
            | jq -r '.artifacts.applicationArchiveUrl')
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.sha }}
          path: ${{ steps.build.outputs.build_id }}/app.apk
          retention-days: 7
          if-no-files-found: error

      - name: Notify on success
        if: success() && github.event_name == 'pull_request'
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "Preview build succeeded for \`${{ github.sha }}\` on ${{ github.ref_name }}" \
            "success"

      - name: Comment PR with APK link
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildId = '${{ steps.build.outputs.build_id }}';
            const sha = '${{ github.sha }}';
            const apkUrl = '${{ steps.download.outputs.apk_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build ✅\n**Build ID:** \`${buildId}\`\n**Commit:** \`${sha}\`\n\n**APK:** ${apkUrl}\n\nCheck the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) or [EAS Dashboard](https://expo.dev/builds/${buildId}).`
            })

      - name: Notify on failure
        if: failure()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "Preview build FAILED for \`${{ github.sha }}\` — check ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "failure"

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build ❌\nBuild failed — check the [Actions log](${{ github.run_url }}) for details.`
            })