name: Build Preview APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Stage 1: CI checks ─────────────────────────────────────────
  ci:
    name: Lint & Typecheck
    uses: ./.github/workflows/_ci.yml
    with:
      ref: ${{ github.sha }}

  # ─── Stage 2: Build (only if CI passed) ──────────────────────────
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build
        id: trigger
        run: |
          # Option A: Trigger via CLI (current approach — waits for build)
          BUILD_ID=$(npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --message "Preview: ${{ github.sha }}" \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build
        run: bash ./script/wait-for-build.sh "${{ steps.trigger.outputs.build_id }}"

      - name: Get artifact URL
        id: artifact
        run: |
          APK_URL=$(npx eas-cli build:view ${{ steps.trigger.outputs.build_id }} --json \
            | jq -r '.artifacts.applicationArchiveUrl')
          echo "url=$APK_URL" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.sha }}
          path: ${{ steps.trigger.outputs.build_id }}/app.apk
          retention-days: 7
          if-no-files-found: error

  # ─── Stage 3: Notify (runs after build, regardless of outcome) ───
  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify on success
        if: success()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "Preview APK built successfully — \`${{ github.sha }}\`" \
            "success"

      - name: Comment on PR — success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build ✅\n**Commit:** \`${{ github.sha }}\`\n**Build ID:** \`${{ needs.build.outputs.build_id }}\`\n\nDownload the APK from the Artifacts section above, or check the [EAS Dashboard](https://expo.dev/builds/${{ needs.build.outputs.build_id }}).`
            })

      - name: Notify on failure
        if: failure()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "Preview build FAILED — \`${{ github.sha }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "failure"

      - name: Comment on PR — failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build ❌\nBuild failed for \`${{ github.sha }}\` — check the [Actions log](${{ github.run_url }}).`
            })