name: Build Preview APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bunx tsc --noEmit --pretty

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start EAS Build
        id: build
        run: |
          BUILD_ID=$(npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --message "${COMMIT_MSG:0:100}" \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build (with 45min timeout)
        run: |
          MAX_WAIT=2700
          ELAPSED=0
          sleep 30
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(npx eas-cli build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status')
            if [ "$STATUS" = "FINISHED" ]; then
              echo "Build completed"
              break
            elif [ "$STATUS" = "ERRORED" ]; then
              echo "Build failed"
              exit 1
            fi
            echo "Status: $STATUS. Waiting... (${ELAPSED}s)"
            sleep 60
            ELAPSED=$((ELAPSED + 60))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Build timed out after 45 minutes"
            exit 1
          fi

      - name: Download APK
        id: download
        run: |
          APK_URL=$(npx eas-cli build:view ${{ steps.build.outputs.build_id }} --json \
            | jq -r '.artifacts.applicationArchiveUrl')
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.sha }}
          path: ${{ steps.download.outputs.apk_path }}
          retention-days: 7

      - name: Comment PR with APK link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildId = '${{ steps.build.outputs.build_id }}';
            const sha = '${{ github.sha }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build\n**Build ID:** \`${buildId}\`\n**Commit:** \`${sha}\`\n\nDownload the APK from the Actions artifacts tab above, or check the build status [here](https://expo.dev/builds/${buildId}).`
            })

      - name: Notify on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build Failed\nCommit: \`${{ github.sha }}\`\nCheck the [Actions log](${{ github.run_url }}) for details.`
            })
