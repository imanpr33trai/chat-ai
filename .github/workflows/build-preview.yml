name: Build Preview APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  EXPO_PUBLIC_API_URL: https://api-gateway-dun-two.vercel.app

jobs:
  # ─── Stage 1: CI checks ─────────────────────────────────────────
  ci:
    name: Lint & Typecheck
    uses: ./.github/workflows/_ci.yml
    with:
      ref: ${{ github.sha }}

  # ─── Stage 2: Build (only if CI passed) ──────────────────────────
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run expo doctor
        run: npx expo doctor --fix 2>&1 || npx expo doctor

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Bundle JavaScript & API routes
        run: |
          npx expo export \
            --platform android \
            --output-dir dist \
            --no-bytecode \
            --no-ssg

      - name: Copy JS bundle to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/index.android.bundle android/app/src/main/assets/index.android.bundle 2>/dev/null || \
          cp dist/_expo/static/js/android/*.js android/app/src/main/assets/ 2>/dev/null || \
          cp dist/index.js android/app/src/main/assets/index.android.bundle 2>/dev/null || \
          echo "Warning: bundle copy failed — checking dist structure"
          ls -R dist/ || true

      - name: Copy API server bundle to Android assets
        run: |
          cp dist/server/index.js android/app/src/main/assets/server.js 2>/dev/null || \
          cp dist/_expo/routes.json android/app/src/main/assets/routes.json 2>/dev/null || \
          echo "API server routes will be loaded from embedded bundle"

      - name: Copy asset files to Android
        run: |
          if [ -d dist/assets ]; then
            cp -r dist/assets android/app/src/main/assets/ 2>/dev/null || true
          fi

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Set Gradle build flags
        run: |
          echo "org.gradle.jvmargs=-XX:MaxMetaspaceSize=1g -Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build Android Debug APK
        env:
          MYAPP_RELEASE_STORE_FILE: my-release-key.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug \
            -PMYAPP_RELEASE_STORE_FILE=$MYAPP_RELEASE_STORE_FILE \
            -PMYAPP_RELEASE_STORE_PASSWORD=$MYAPP_RELEASE_STORE_PASSWORD \
            -PMYAPP_RELEASE_KEY_ALIAS=$MYAPP_RELEASE_KEY_ALIAS \
            -PMYAPP_RELEASE_KEY_PASSWORD=$MYAPP_RELEASE_KEY_PASSWORD \
            --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # ─── Stage 3: Comment on PR ─────────────────────────────────────
  comment-pr:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment on PR — success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build ✅\n**Commit:** \`${{ github.sha }}\`\n\nDownload the APK from the Artifacts section above.`
            })

      - name: Comment on PR — failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,

              body: `### Preview Build ❌\nBuild failed for \`${{ github.sha }}\` — check the [Actions log](${{ github.run_url }}).`
            })