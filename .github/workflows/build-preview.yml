name: Build Preview APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  EXPO_PUBLIC_API_URL: https://api-gateway-dun-two.vercel.app

jobs:
  # ─── Stage 1: CI checks ─────────────────────────────────────────
  ci:
    name: Lint & Typecheck
    uses: ./.github/workflows/_ci.yml
    with:
      ref: ${{ github.sha }}

  # ─── Stage 2: Build (only if CI passed) ──────────────────────────
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          MYAPP_RELEASE_STORE_FILE: my-release-key.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug \
            -PMYAPP_RELEASE_STORE_FILE=$MYAPP_RELEASE_STORE_FILE \
            -PMYAPP_RELEASE_STORE_PASSWORD=$MYAPP_RELEASE_STORE_PASSWORD \
            -PMYAPP_RELEASE_KEY_ALIAS=$MYAPP_RELEASE_KEY_ALIAS \
            -PMYAPP_RELEASE_KEY_PASSWORD=$MYAPP_RELEASE_KEY_PASSWORD \
            --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # ─── Stage 3: Notify ─────────────────────────────────────────────
  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify on success
        if: success()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "Preview APK built successfully — \`${{ github.sha }}\`" \
            "success"

      - name: Comment on PR — success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build ✅\n**Commit:** \`${{ github.sha }}\`\n\nDownload the APK from the Artifacts section above.`
            })

      - name: Notify on failure
        if: failure()
        run: |
          bash ./script/slack-notify.sh \
            "${{ secrets.SLACK_WEBHOOK }}" \
            "Preview build FAILED — \`${{ github.sha }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "failure"

      - name: Comment on PR — failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Build ❌\nBuild failed for \`${{ github.sha }}\` — check the [Actions log](${{ github.run_url }}).`
            })