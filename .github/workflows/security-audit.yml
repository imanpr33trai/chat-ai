name: Security — Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6 AM UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run audit
        run: bun audit 2>&1 || echo "Audit found issues — check logs"
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          bunx npm-audit-json 2>/dev/null || bun audit --json 2>/dev/null || echo "No audit JSON output available"
